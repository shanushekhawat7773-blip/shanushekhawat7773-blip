<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="center-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hairline Rule -->
  <line x1="40" y1="12" x2="960" y2="12" stroke="url(#div-grad)" stroke-width="1"/>

  <!-- Center Decorative Diamond Anchor -->
  <g transform="translate(500, 12)">
    <rect x="-4" y="-4" width="8" height="8" transform="rotate(45)" fill="#0B0F19" stroke="#818CF8" stroke-width="1.2" filter="url(#center-glow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#38BDF8"/>
  </g>

  <!-- Flanking Subtle Markers -->
  <circle cx="420" cy="12" r="1.5" fill="#475569" opacity="0.6"/>
  <circle cx="580" cy="12" r="1.5" fill="#475569" opacity="0.6"/>
</svg>
