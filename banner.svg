<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="ambient-cyan" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-indigo" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.65" stroke-opacity="0.35"/>
    </pattern>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-text { font-weight: 800; letter-spacing: 2px; }
    .subtitle-text { font-weight: 500; letter-spacing: 0.5px; }
  </style>

  <!-- Base Card Background -->
  <rect width="960" height="260" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Ambient Glow Highlights -->
  <rect width="960" height="260" rx="16" fill="url(#ambient-cyan)"/>
  <rect width="960" height="260" rx="16" fill="url(#ambient-indigo)"/>

  <!-- Geometric Grid Layer -->
  <rect width="960" height="260" rx="16" fill="url(#tech-grid)"/>

  <!-- Card Border -->
  <rect x="1" y="1" width="958" height="258" rx="15" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Geometric Abstract Network / Graph Art (Right Side) -->
  <g opacity="0.65" transform="translate(140, 0)">
    <!-- Interconnecting Mesh Lines -->
    <line x1="620" y1="50" x2="710" y2="85" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="4 2" stroke-opacity="0.5"/>
    <line x1="710" y1="85" x2="680" y2="160" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="680" y1="160" x2="760" y2="195" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="710" y1="85" x2="790" y2="110" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="680" y1="160" x2="590" y2="190" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="590" y1="190" x2="620" y2="50" stroke="#6366F1" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="760" y1="195" x2="790" y2="110" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Neural / Data Nodes -->
    <circle cx="620" cy="50" r="4.5" fill="#818CF8" filter="url(#glow)"/>
    <circle cx="620" cy="50" r="2.5" fill="#FFFFFF"/>

    <circle cx="710" cy="85" r="5.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="710" cy="85" r="3" fill="#FFFFFF"/>

    <circle cx="680" cy="160" r="5" fill="#6366F1" filter="url(#glow)"/>
    <circle cx="680" cy="160" r="2.5" fill="#FFFFFF"/>

    <circle cx="760" cy="195" r="4" fill="#818CF8"/>
    <circle cx="760" cy="195" r="2" fill="#FFFFFF"/>

    <circle cx="790" cy="110" r="4.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="790" cy="110" r="2.5" fill="#FFFFFF"/>

    <circle cx="590" cy="190" r="3.5" fill="#4F46E5"/>

    <!-- Decorative Poly Accent -->
    <polygon points="710,85 790,110 760,195 680,160" fill="#6366F1" fill-opacity="0.04"/>
    <polygon points="620,50 710,85 680,160 590,190" fill="#38BDF8" fill-opacity="0.03"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(64, 46)">
    <!-- Academic Badge Pill -->
    <g transform="translate(0, 0)">
      <rect width="400" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <!-- Pulsing Dot -->
      <circle cx="15" cy="14" r="3.5" fill="#38BDF8"/>
      <text x="28" y="18" fill="#94A3B8" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.8px">
        IIT JODHPUR • B.S. APPLIED AI &amp; DATA SCIENCE
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="78" fill="#F8FAFC" class="font-sans title-text" font-size="38">
      ARUN SINGH
    </text>

    <!-- Focus & Role Headline -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="url(#accent-grad)" class="font-sans subtitle-text" font-size="16" font-weight="600">
        AI/ML Systems
      </text>
      <text x="118" y="0" fill="#475569" class="font-sans" font-size="16">•</text>
      <text x="135" y="0" fill="#E2E8F0" class="font-sans subtitle-text" font-size="16" font-weight="500">
        Applied AI &amp; Data Science
      </text>
      <text x="338" y="0" fill="#475569" class="font-sans" font-size="16">•</text>
      <text x="355" y="0" fill="#94A3B8" class="font-sans subtitle-text" font-size="16" font-weight="500">
        AI Agents
      </text>
    </g>

    <!-- Mission / Tagline -->
    <text x="0" y="148" fill="#64748B" class="font-sans" font-size="13.5" font-weight="400">
      Engineering reliable machine intelligence, verified pipelines &amp; real-world AI applications.
    </text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="30" y="248" width="900" height="2" fill="url(#line-grad)" rx="1"/>
</svg>
